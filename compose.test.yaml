# 独立的临时测试服务；凭据仅由 scripts/test-integration.mjs 提供。
services:
  mysql:
    image: mysql:8.0.26@sha256:5d52dc010398db422949f079c76e98f6b62230e5b59c0bf7582409d2c85abacb
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: riqvo_test
      MYSQL_USER: riqvo_test
      MYSQL_PASSWORD: ${RIQVO_TEST_MYSQL_PASSWORD:?Use pnpm test:integration}
      MYSQL_ROOT_PASSWORD: ${RIQVO_TEST_MYSQL_ROOT_PASSWORD:?Use pnpm test:integration}
    ports:
      - '127.0.0.1::3306'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 20s
  redis:
    image: redis:7.4.12-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 10
